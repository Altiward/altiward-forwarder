<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 516" width="1000" height="516" role="img" aria-labelledby="title desc">
  <title id="title">How altiward-forwarder sends SAP Privileges events</title>
  <desc id="desc">With the relay: on each Mac, SAP Privileges sends a webhook for each change and queues what it can't send. The webhook goes over HTTPS, with a client certificate, to the relay on your host. The relay checks each Mac's certificate, maps each change to OCSF and stores it on disk before it answers, then sends it to your SIEM (Splunk, Microsoft Sentinel or syslog) as OCSF or CEF over HTTPS or TLS. With the hook: on each Mac, SAP Privileges runs the hook as the user on each change. The hook checks the admin group, queues events until they are sent, and holds the SIEM token. It sends OCSF over HTTPS straight to Splunk, Microsoft Sentinel or an HTTPS webhook, with the SIEM token on every Mac.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #111111; }
    .title { font-size: 15px; font-weight: 600; }
    .name { font-size: 14px; font-weight: 600; }
    .note { fill: #585858; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #585858; }
    .group { fill: #f3f3f3; }
    .box { fill: #ffffff; stroke: #808080; stroke-width: 1; }
    .outside { fill: #ffffff; stroke: #808080; stroke-width: 1; stroke-dasharray: 4 3; }
    .flow { fill: none; stroke: #111111; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
    <g id="mark">
      <rect x="0" y="12" width="18" height="4.5" fill="#1c1713"/>
      <rect x="6" y="6" width="12" height="4.5" fill="#1c1713"/>
      <rect x="12" y="0" width="6" height="4.5" fill="#ff8a1f"/>
    </g>
  </defs>
  <rect width="1000" height="516" fill="#ffffff"/>

  <!-- Each Mac, with the relay -->
  <rect class="group" x="24" y="24" width="248" height="128" rx="10"/>
  <text class="title" x="40" y="48">Each Mac, with the relay</text>
  <rect class="box" x="40" y="64" width="216" height="72" rx="8"/>
  <text class="name" x="56" y="86">SAP Privileges</text>
  <text class="note" x="56" y="106">a webhook for each change</text>
  <text class="note" x="56" y="125">queues what it can't send</text>

  <!-- The relay -->
  <rect class="group" x="408" y="24" width="288" height="176" rx="10"/>
  <text class="title" x="424" y="48">The relay, on your host</text>
  <rect class="box" x="424" y="64" width="256" height="120" rx="8"/>
  <use href="#mark" x="440" y="74"/>
  <text class="name" x="466" y="86">Forwarder relay</text>
  <text class="note" x="440" y="108">checks each Mac's certificate</text>
  <text class="note" x="440" y="127">maps each change to OCSF</text>
  <text class="note" x="440" y="146">stores it on disk, then answers</text>
  <text class="mono" x="440" y="168">altiward-forwarder</text>

  <path class="flow" d="M256 100 H422"/>
  <text class="mono" x="340" y="72" text-anchor="middle">HTTPS webhook</text>
  <text class="mono" x="340" y="87" text-anchor="middle">client certificate</text>
  <path class="flow" d="M680 142 H790"/>
  <text class="mono" x="744" y="114" text-anchor="middle">OCSF or CEF</text>
  <text class="mono" x="744" y="129" text-anchor="middle">HTTPS or TLS</text>

  <!-- Each Mac, with the hook -->
  <rect class="group" x="24" y="232" width="248" height="260" rx="10"/>
  <text class="title" x="40" y="256">Each Mac, with the hook</text>
  <rect class="box" x="40" y="272" width="216" height="52" rx="8"/>
  <text class="name" x="56" y="294">SAP Privileges</text>
  <text class="note" x="56" y="313">runs the hook on each change</text>
  <path class="flow" d="M148 324 V354"/>
  <text class="mono" x="158" y="344">as the user</text>
  <rect class="box" x="40" y="356" width="216" height="120" rx="8"/>
  <use href="#mark" x="56" y="370"/>
  <text class="name" x="82" y="382">Forwarder hook</text>
  <text class="note" x="56" y="404">checks the admin group</text>
  <text class="note" x="56" y="423">queues events until sent</text>
  <text class="note" x="56" y="442">holds the SIEM token</text>
  <text class="mono" x="56" y="464">altiward-forwarder-hook</text>

  <path class="flow" d="M256 416 H744 V298 H790"/>
  <text class="mono" x="500" y="404" text-anchor="middle">OCSF over HTTPS, with the SIEM token on every Mac</text>

  <!-- Your SIEM -->
  <rect class="group" x="792" y="84" width="184" height="256" rx="10"/>
  <text class="title" x="808" y="108">Your SIEM</text>
  <rect class="box" x="808" y="124" width="152" height="36" rx="8"/>
  <text x="824" y="147">Splunk</text>
  <rect class="box" x="808" y="168" width="152" height="36" rx="8"/>
  <text x="824" y="191">Microsoft Sentinel</text>
  <rect class="box" x="808" y="212" width="152" height="52" rx="8"/>
  <text x="824" y="234">Syslog</text>
  <text class="note" x="824" y="253">from the relay</text>
  <rect class="box" x="808" y="272" width="152" height="52" rx="8"/>
  <text x="824" y="294">HTTPS webhook</text>
  <text class="note" x="824" y="313">from the hook</text>
</svg>
