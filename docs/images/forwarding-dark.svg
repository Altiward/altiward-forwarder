<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" width="1000" height="632" role="img" aria-labelledby="title desc">
  <title id="title">Two ways altiward-forwarder sends SAP Privileges events</title>
  <desc id="desc">Two options; use one or the other. The relay: on each Mac, SAP Privileges sends a webhook for each change and queues what it can't send. The webhook goes over HTTPS, with a client certificate, to the relay on your host. The relay checks each Mac's certificate, maps each change to OCSF and stores it on disk before it answers, then sends it to Splunk, Microsoft Sentinel or syslog as OCSF or CEF over HTTPS or TLS. Or the on-Mac hook: on each Mac, SAP Privileges runs the hook as the user on each change. The hook checks the admin group, queues events until they are sent, and holds the SIEM token. It sends OCSF over HTTPS straight from each Mac to Splunk, Microsoft Sentinel or an HTTPS webhook, with the SIEM token on every Mac.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #f2f2f2; }
    .option { font-size: 17px; font-weight: 700; }
    .title { font-size: 15px; font-weight: 600; }
    .name { font-size: 14px; font-weight: 600; }
    .note { fill: #a9a9a9; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #a9a9a9; }
    .frame { fill: none; stroke: #3a3a3a; stroke-width: 1; }
    .group { fill: #171717; }
    .box { fill: #0e0e0e; stroke: #7a7a7a; stroke-width: 1; }
    .outside { fill: #0e0e0e; stroke: #7a7a7a; stroke-width: 1; stroke-dasharray: 4 3; }
    .flow { fill: none; stroke: #f2f2f2; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2f2f2"/>
    </marker>
    <g id="mark">
      <rect x="0" y="12" width="18" height="4.5" fill="#f4ede4"/>
      <rect x="6" y="6" width="12" height="4.5" fill="#f4ede4"/>
      <rect x="12" y="0" width="6" height="4.5" fill="#ff8a1f"/>
    </g>
  </defs>
  <rect width="1000" height="632" fill="#0e0e0e"/>

  <!-- Option: the relay -->
  <rect class="frame" x="16" y="16" width="968" height="240" rx="14"/>
  <text class="option" x="32" y="44">The relay</text>

  <rect class="group" x="32" y="60" width="240" height="128" rx="10"/>
  <text class="title" x="48" y="84">Each Mac</text>
  <rect class="box" x="48" y="100" width="208" height="72" rx="8"/>
  <text class="name" x="64" y="122">SAP Privileges</text>
  <text class="note" x="64" y="142">a webhook for each change</text>
  <text class="note" x="64" y="161">queues what it can't send</text>

  <rect class="group" x="408" y="60" width="288" height="180" rx="10"/>
  <text class="title" x="424" y="84">Your host</text>
  <rect class="box" x="424" y="100" width="256" height="124" rx="8"/>
  <use href="#mark" x="440" y="110"/>
  <text class="name" x="466" y="122">Forwarder relay</text>
  <text class="note" x="440" y="144">checks each Mac's certificate</text>
  <text class="note" x="440" y="163">maps each change to OCSF</text>
  <text class="note" x="440" y="182">stores it on disk, then answers</text>
  <text class="mono" x="440" y="206">altiward-forwarder</text>

  <rect class="group" x="792" y="60" width="176" height="180" rx="10"/>
  <text class="title" x="808" y="84">Your SIEM</text>
  <rect class="box" x="808" y="100" width="144" height="36" rx="8"/>
  <text x="824" y="123">Splunk</text>
  <rect class="box" x="808" y="144" width="144" height="36" rx="8"/>
  <text x="824" y="167">Microsoft Sentinel</text>
  <rect class="box" x="808" y="188" width="144" height="36" rx="8"/>
  <text x="824" y="211">Syslog</text>

  <path class="flow" d="M256 136 H422"/>
  <text class="mono" x="340" y="108" text-anchor="middle">HTTPS webhook</text>
  <text class="mono" x="340" y="123" text-anchor="middle">client certificate</text>
  <path class="flow" d="M680 162 H790"/>
  <text class="mono" x="744" y="134" text-anchor="middle">OCSF or CEF</text>
  <text class="mono" x="744" y="149" text-anchor="middle">HTTPS or TLS</text>

  <!-- Or -->
  <rect class="box" x="476" y="262" width="48" height="28" rx="14"/>
  <text class="name" x="500" y="281" text-anchor="middle">or</text>

  <!-- Option: the on-Mac hook -->
  <rect class="frame" x="16" y="296" width="968" height="320" rx="14"/>
  <text class="option" x="32" y="324">The on-Mac hook</text>

  <rect class="group" x="32" y="340" width="240" height="260" rx="10"/>
  <text class="title" x="48" y="364">Each Mac</text>
  <rect class="box" x="48" y="380" width="208" height="52" rx="8"/>
  <text class="name" x="64" y="402">SAP Privileges</text>
  <text class="note" x="64" y="421">runs the hook on each change</text>
  <path class="flow" d="M152 432 V462"/>
  <text class="mono" x="162" y="452">as the user</text>
  <rect class="box" x="48" y="464" width="208" height="120" rx="8"/>
  <use href="#mark" x="64" y="478"/>
  <text class="name" x="90" y="490">Forwarder hook</text>
  <text class="note" x="64" y="512">checks the admin group</text>
  <text class="note" x="64" y="531">queues events until sent</text>
  <text class="note" x="64" y="550">holds the SIEM token</text>
  <text class="mono" x="64" y="572">altiward-forwarder-hook</text>

  <rect class="group" x="792" y="420" width="176" height="180" rx="10"/>
  <text class="title" x="808" y="444">Your SIEM</text>
  <rect class="box" x="808" y="460" width="144" height="36" rx="8"/>
  <text x="824" y="483">Splunk</text>
  <rect class="box" x="808" y="504" width="144" height="36" rx="8"/>
  <text x="824" y="527">Microsoft Sentinel</text>
  <rect class="box" x="808" y="548" width="144" height="36" rx="8"/>
  <text x="824" y="571">HTTPS webhook</text>

  <path class="flow" d="M256 522 H790"/>
  <text class="mono" x="524" y="510" text-anchor="middle">OCSF over HTTPS, straight from each Mac</text>
  <text class="mono" x="524" y="544" text-anchor="middle">with the SIEM token on every Mac</text>
</svg>
