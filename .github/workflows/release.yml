name: Release relay

# Builds a relay release when a vX.Y.Z tag is pushed: the image for amd64 and arm64 with
# provenance and an SBOM, pushed to the public ghcr.io package and signed; the same image
# saved per platform for docker load; the compose file and the Privileges profile; the
# release notes from CHANGELOG.md; and SHA256SUMS over all of it, signed so anyone can check
# the files without registry access. The last job publishes them on GitHub Releases; a
# release candidate (vX.Y.Z-rc.N) is marked a pre-release.
#
# No secrets: the registry login uses GITHUB_TOKEN, and signing is keyless, using this
# workflow's GitHub identity, recorded in Sigstore's public transparency log.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing
    # A maintainer approves before anything is pushed or signed. Its own environment, with no
    # secrets: the Apple signing secrets live only in release-hook.
    environment: release-relay
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Version from the tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "tag must be vX.Y.Z or vX.Y.Z-rc.N, got $GITHUB_REF_NAME"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/altiward-forwarder"
          out="$RUNNER_TEMP/release"
          { echo "VERSION=$v"; echo "IMAGE=$image"; echo "OUT=$out"; } >> "$GITHUB_ENV"
          { echo "version=$v"; echo "image=$image"; echo "out=$out"; } >> "$GITHUB_OUTPUT"

      - name: Release notes (refuses a version without a dated CHANGELOG section)
        run: |
          mkdir -p "$OUT"
          scripts/release-notes.sh relay "$VERSION" > "$OUT/RELEASE_NOTES.md"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from nothing a cache could have changed
      - name: Tests
        run: make lint test deps-check

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Users pin a version; there is deliberately no "latest" tag.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          push: true
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image and check the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      # Pulled back from the registry, so the files are the signed image, bit for bit.
      - name: Image files for docker load
        run: |
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE:$VERSION"
            docker save "$IMAGE:$VERSION" | gzip -9 > "$OUT/altiward-forwarder-$VERSION-linux-$arch.tar.gz"
            docker rmi "$IMAGE:$VERSION"
          done

      - name: Compose file and profile
        run: cp deploy/compose.yaml profiles/altiward-forwarder-privileges-webhook.mobileconfig "$OUT/"

      - name: Sign the checksums and check the signature
        working-directory: ${{ steps.version.outputs.out }}
        run: |
          sha256sum -- *.tar.gz compose.yaml altiward-forwarder-privileges-webhook.mobileconfig RELEASE_NOTES.md > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: altiward-forwarder-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.out }}/*
          retention-days: 90

  # Publishes the signed files. The only job that can write to the repository.
  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: altiward-forwarder-${{ needs.image.outputs.version }}
          path: files

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" files/* \
            --verify-tag --title "Relay $TAG" --notes-file files/RELEASE_NOTES.md "${flags[@]}"
